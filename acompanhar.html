<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Acompanhar Trator — Telemetria</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0B120D; --surface:#111A13; --surface-2:#182219; --line:#22301F;
  --text:#E7EFE4; --text-muted:#8CA089; --amber:#E8A33D; --amber-dim:#8A6425;
  --green:#7CB35C; --mono:'Courier New',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
.header{
  display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);
}
.header .icon{width:34px;height:34px;border-radius:8px;background:linear-gradient(160deg,var(--green),#4C7A34);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.header h1{font-size:15px;margin:0;letter-spacing:.02em;}
.header p{font-size:11px;margin:0;color:var(--text-muted);}
.status-pill{
  margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;
  padding:6px 12px;font-family:var(--mono);font-size:11px;text-transform:uppercase;color:var(--text-muted);flex-shrink:0;
}
.status-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--text-muted);}
.status-pill.on{border-color:var(--amber-dim);color:var(--amber);}
.status-pill.on .dot{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

#mapWrap{position:relative;height:52vh;min-height:280px;border-bottom:1px solid var(--line);}
#map{width:100%;height:100%;background:#1a1a1a;}

.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);}
.stat-card{background:var(--surface);padding:14px 16px;}
.stat-card .lbl{font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
.stat-card .val{font-family:var(--mono);font-size:20px;color:var(--text);}
.stat-card .val.amber{color:var(--amber);}
.stat-card .val.green{color:var(--green);}

.info-block{padding:14px 16px;border-bottom:1px solid var(--line);}
.info-block .row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--text-muted);}
.info-block .row b{color:var(--text);font-weight:600;}

.progress-wrap{padding:14px 16px;}
.progress-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-muted);margin-bottom:6px;font-family:var(--mono);}
.progress-track{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden;}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#4C7A34,var(--green));transition:width .4s ease;}
.remaining{text-align:right;margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--text-muted);}
.remaining b{color:var(--green);}

.empty{text-align:center;color:var(--text-muted);font-size:13px;padding:60px 24px;}
.err{color:#E0645A;font-size:12px;padding:10px 16px;}
</style>
</head>
<body>

<div class="header">
  <div class="icon">🚜</div>
  <div>
    <h1>ACOMPANHAR TRATOR</h1>
    <p>visualização ao vivo</p>
  </div>
  <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">carregando…</span></div>
</div>

<div id="mapWrap">
  <div id="map"></div>
</div>

<div id="content">
  <div class="empty" id="emptyState">Aguardando dados do trator…</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD2lHB5tC4-8K_d8-SsNIvksF5vIErBlw0",
  authDomain: "mapas-talhao.firebaseapp.com",
  projectId: "mapas-talhao",
  storageBucket: "mapas-talhao.firebasestorage.app",
  messagingSenderId: "919142593673",
  appId: "1:919142593673:web:3d46cfad50665f3eec8258",
  measurementId: "G-SDW8L0W0X2"
};

let db = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
}catch(e){
  document.getElementById('emptyState').innerHTML = '<div class="err">Não consegui conectar ao Firebase. Verifique a conexão e recarregue a página.</div>';
}

const map = L.map('map',{zoomControl:true,attributionControl:false}).setView([-4.3,-44.4],14);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{crossOrigin:'anonymous',maxZoom:19}).addTo(map);
L.control.attribution({prefix:false}).addAttribution('© OpenStreetMap contributors © CARTO').addTo(map);

let jobLayer = L.layerGroup().addTo(map);
let tractorMarker = null;
let firstUpdate = true;

function fmt(n,d=2){ return (n||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function timeAgo(iso){
  if(!iso) return '—';
  const diffS = Math.floor((Date.now()-new Date(iso).getTime())/1000);
  if(diffS < 5) return 'agora';
  if(diffS < 60) return `há ${diffS}s`;
  if(diffS < 3600) return `há ${Math.floor(diffS/60)} min`;
  return `há ${Math.floor(diffS/3600)}h`;
}

let lastData = null;
function render(data){
  lastData = data;
  document.getElementById('emptyState').style.display = 'none';

  const pill = document.getElementById('statusPill');
  const statusText = document.getElementById('statusText');
  const isAtivo = data.status === 'ativo';
  pill.classList.toggle('on', isAtivo);
  statusText.textContent = isAtivo ? 'Em operação' : 'Parado';

  // desenha/atualiza o contorno do talhão, se houver um trabalho ativo vinculado
  jobLayer.clearLayers();
  if(data.jobPoints && data.jobPoints.length >= 3){
    L.polygon(data.jobPoints,{color:'#E8A33D',weight:3,fillColor:'#E8A33D',fillOpacity:.08,lineJoin:'round'}).addTo(jobLayer);
  }

  // atualiza a posição do trator
  if(data.lat!=null && data.lng!=null){
    const pos = [data.lat, data.lng];
    if(!tractorMarker){
      tractorMarker = L.circleMarker(pos,{radius:8,color:'#2ECC71',fillColor:'#2ECC71',fillOpacity:1,weight:2}).addTo(map);
    }else{
      tractorMarker.setLatLng(pos);
    }
    tractorMarker.setStyle({fillColor: isAtivo ? '#2ECC71' : '#8CA089', color: isAtivo ? '#2ECC71' : '#8CA089'});
    if(firstUpdate){
      if(data.jobPoints && data.jobPoints.length>=3){ map.fitBounds(data.jobPoints,{padding:[30,30]}); }
      else{ map.setView(pos, 16); }
      firstUpdate = false;
    }
  }

  const w = data.areaHa!=null;
  const contentHtml = `
    <div class="stat-row">
      <div class="stat-card"><div class="lbl">Velocidade</div><div class="val">${fmt(data.speedKmh,1)} <span style="font-size:12px;color:var(--text-muted);">km/h</span></div></div>
      <div class="stat-card"><div class="lbl">Área feita hoje</div><div class="val green">${fmt(data.areaHa,2)} <span style="font-size:12px;color:var(--text-muted);">ha</span></div></div>
    </div>
    <div class="info-block">
      <div class="row"><span>Operador</span><b>${data.operador||'—'}</b></div>
      <div class="row"><span>Talhão</span><b>${data.talhao||'—'}</b></div>
      <div class="row"><span>Fazenda</span><b>${data.fazenda||'—'}</b></div>
      <div class="row"><span>Distância</span><b>${fmt(data.distKm,2)} km</b></div>
      <div class="row"><span>Última atualização</span><b>${timeAgo(data.updatedISO)}</b></div>
    </div>
    ${data.jobNome && data.jobAreaHa ? `
    <div class="progress-wrap">
      <div class="progress-labels">
        <span>Progresso no talhão (${data.jobNome})</span>
        <span>${fmt(Math.min(100,(data.areaHa/data.jobAreaHa)*100),0)}%</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,(data.areaHa/data.jobAreaHa)*100)}%;"></div></div>
      <div class="remaining">restam <b>${fmt(Math.max(0,data.jobAreaHa-data.areaHa),2)} ha</b> de ${fmt(data.jobAreaHa,2)} ha</div>
    </div>` : ''}
  `;
  document.getElementById('content').innerHTML = contentHtml;
}

if(db){
  db.collection('telemetria_live').doc('atual').onSnapshot(
    (doc)=>{
      if(!doc.exists){
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('emptyState').textContent = 'Nenhum trator em operação no momento.';
        document.getElementById('content').innerHTML = '<div class="empty" id="emptyState">Nenhum trator em operação no momento.</div>';
        return;
      }
      render(doc.data());
    },
    (err)=>{
      console.warn('Erro ao ouvir posição ao vivo', err);
      document.getElementById('emptyState').innerHTML = '<div class="err">Não consegui carregar os dados ao vivo. Verifique sua conexão.</div>';
    }
  );
  // reatualiza o "há X min" a cada 15s mesmo que nenhuma posição nova tenha chegado
  setInterval(()=>{ if(lastData) render(lastData); }, 15000);
}
</script>
</body>
</html>
