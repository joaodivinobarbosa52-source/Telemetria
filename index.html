<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Telemetria Trator</title>
<meta name="theme-color" content="#0B120D">
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Telemetria%20Trator%22,%22short_name%22:%22Telemetria%22,%22display%22:%22standalone%22,%22background_color%22:%22%230B120D%22,%22theme_color%22:%22%230B120D%22}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#0B120D;
  --surface:#121C15;
  --surface-2:#182419;
  --line:#243428;
  --amber:#E8A33D;
  --amber-dim:#8A6425;
  --green:#7CB35C;
  --red:#D96B4F;
  --text:#F2EDE1;
  --text-muted:#8FA08F;
  --mono:'Chakra Petch',monospace;
  --sans:'Inter',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;overscroll-behavior:none;}
body{padding-bottom:76px;}
::selection{background:var(--amber);color:#0B120D;}

/* header */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 10px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:8px;background:linear-gradient(160deg,var(--amber),var(--amber-dim));
  display:flex;align-items:center;justify-content:center;font-size:18px;
}
.brand-name{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.03em;}
.brand-sub{font-size:10px;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;margin-top:1px;}
.status-pill{
  font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  padding:5px 10px;border-radius:20px;border:1px solid var(--line);color:var(--text-muted);
  display:flex;align-items:center;gap:6px;
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--text-muted);}
.status-pill.active{border-color:var(--green);color:var(--green);}
.status-pill.active .status-dot{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* tabs */
.tabs{display:flex;gap:6px;padding:0 18px 12px;}
.tab-btn{
  flex:1;padding:9px 0;text-align:center;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;
  background:transparent;border:1px solid var(--line);color:var(--text-muted);border-radius:10px;text-transform:uppercase;
}
.tab-btn.on{background:var(--surface-2);color:var(--amber);border-color:var(--amber-dim);}

.view{display:none;padding:0 18px;}
.view.on{display:block;}

/* instrument cluster */
.cluster{
  background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.cluster::before{
  content:'';position:absolute;top:-40%;right:-20%;width:60%;height:180%;
  background:radial-gradient(closest-side,rgba(232,163,61,.08),transparent);
}
.cluster-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;position:relative;}
.readout{padding:6px 10px;}
.readout-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:4px;}
.readout-value{font-family:var(--mono);font-weight:600;font-size:38px;line-height:1;color:var(--text);}
.readout-value.hero{font-size:52px;color:var(--amber);}
.readout-unit{font-size:13px;color:var(--text-muted);margin-left:4px;font-weight:400;}
.readout.divider-r{border-right:1px solid var(--line);}
.readout.divider-t{border-top:1px solid var(--line);margin-top:14px;padding-top:16px;}

.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.stat-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center;}
.stat-card .lbl{font-size:9.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.07em;}
.stat-card .val{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:4px;}

#map{height:220px;border-radius:16px;margin-bottom:14px;border:1px solid var(--line);background:#0e150f;}

.field{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  display:flex;align-items:center;justify-content:space-between;padding:12px 14px;margin-bottom:10px;
}
.field label{font-size:12.5px;color:var(--text-muted);}
.field input[type=number], .field input[type=text]{
  background:var(--surface-2);border:1px solid var(--line);color:var(--text);
  font-family:var(--mono);font-size:15px;width:90px;text-align:right;padding:8px 10px;border-radius:8px;
}
.field input:focus{outline:none;border-color:var(--amber-dim);}

.btn-row{display:flex;gap:10px;margin:16px 0;}
.btn{
  flex:1;padding:16px 0;border-radius:14px;border:none;font-family:var(--mono);font-weight:600;
  font-size:14px;letter-spacing:.04em;text-transform:uppercase;
}
.btn-start{background:var(--green);color:#0B120D;}
.btn-stop{background:var(--red);color:#0B120D;}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--line);}
.btn:active{transform:scale(.97);}
.btn[disabled]{opacity:.4;}

.mini-actions{display:flex;gap:10px;margin-bottom:22px;}
.mini-actions .btn{padding:12px 0;font-size:12px;}

/* history */
.session-card{
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;
}
.session-card .date{font-family:var(--mono);color:var(--amber);font-size:13px;margin-bottom:8px;}
.session-metrics{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.session-metrics div{font-size:11px;color:var(--text-muted);}
.session-metrics b{display:block;color:var(--text);font-family:var(--mono);font-size:15px;margin-top:2px;}
.empty-state{text-align:center;color:var(--text-muted);font-size:13px;padding:40px 20px;}

.footer-bar{
  position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);
  padding:10px 18px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;
}
.sync-note{font-size:10px;color:var(--text-muted);text-align:center;margin:6px 0 16px;}
.sync-note.err{color:var(--red);}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">🚜</div>
    <div>
      <div class="brand-name">TELEMETRIA</div>
      <div class="brand-sub">Rendimento de campo</div>
    </div>
  </div>
  <div class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusText">Parado</span></div>
</div>

<div class="tabs">
  <button class="tab-btn on" data-view="opView">Operação</button>
  <button class="tab-btn" data-view="histView">Histórico</button>
  <button class="tab-btn" data-view="cfgView">Ajustes</button>
</div>

<!-- OPERAÇÃO -->
<div class="view on" id="opView">
  <div class="cluster">
    <div class="cluster-grid">
      <div class="readout divider-r">
        <div class="readout-label">Velocidade <span id="speedNote" style="text-transform:none;letter-spacing:0;">(a cada 50 m)</span></div>
        <div class="readout-value" id="speedVal">0,0<span class="readout-unit">km/h</span></div>
      </div>
      <div class="readout">
        <div class="readout-label">Rendimento agora</div>
        <div class="readout-value hero" id="instRate">0,00<span class="readout-unit">ha/h</span></div>
      </div>
    </div>
    <div class="readout divider-t">
      <div class="readout-label">Rendimento médio da sessão</div>
      <div class="readout-value" id="avgRate">0,00<span class="readout-unit">ha/h</span></div>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-card"><div class="lbl">Área</div><div class="val" id="areaVal">0,00 ha</div></div>
    <div class="stat-card"><div class="lbl">Distância</div><div class="val" id="distVal">0,00 km</div></div>
    <div class="stat-card"><div class="lbl">Tempo</div><div class="val" id="timeVal">00:00:00</div></div>
  </div>

  <div id="map"></div>

  <div class="btn-row">
    <button class="btn btn-start" id="startBtn">▶ Iniciar operação</button>
    <button class="btn btn-stop" id="stopBtn" style="display:none;">■ Finalizar</button>
  </div>
</div>

<!-- HISTÓRICO -->
<div class="view" id="histView">
  <div id="histList"><div class="empty-state">Nenhuma sessão registrada ainda.</div></div>
</div>

<!-- AJUSTES -->
<div class="view" id="cfgView">
  <div class="field">
    <label>Largura de trabalho (m)</label>
    <input type="number" id="widthInput" step="0.1" value="12" min="0.1">
  </div>
  <div class="field">
    <label>Intervalo de cálculo (m)</label>
    <input type="number" id="intervalInput" step="1" value="50" min="1">
  </div>
  <div class="field">
    <label>Operador</label>
    <input type="text" id="operatorInput" placeholder="Nome">
  </div>
  <div class="field">
    <label>Talhão / Área</label>
    <input type="text" id="fieldInput" placeholder="Ex: Talhão 3">
  </div>
  <div class="field">
    <label>Fazenda</label>
    <input type="text" id="farmInput" placeholder="Ex: Rio da Vida">
  </div>
  <div class="sync-note" id="syncNote">Verificando conexão com Firebase…</div>
</div>

<div class="footer-bar" id="footerBar" style="display:none;">
  <button class="btn btn-ghost" id="pdfBtn">📄 PDF</button>
  <button class="btn btn-ghost" id="waBtn">📲 WhatsApp</button>
</div>

<script>
/* ======================= FIREBASE ======================= */
// Substitua pelas credenciais do seu projeto Firebase (mesmo padrão dos outros apps do ecossistema Agro).
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO",
  storageBucket: "SEU_PROJETO.appspot.com",
  messagingSenderId: "0000000000",
  appId: "SUA_APP_ID"
};
let db = null, firebaseOK = false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  firebaseOK = true;
}catch(e){ firebaseOK = false; }

const COLLECTION = "telemetria_sessoes";

/* ======================= STATE ======================= */
let tracking = false;
let watchId = null;
let path = []; // {lat,lng,t,speedKmh}
let polyline = null, marker = null, map = null;
let startTime = null;
let elapsedWorkMs = 0; // only accumulates while moving
let lastTickTime = null;
let totalDistanceKm = 0;
let lastPos = null;
let currentSpeedKmh = 0;
let timerInterval = null;
const MIN_MOVE_SPEED_KMH = 0.6; // below this, treated as idle (não conta tempo/área)
const MAX_ACCEPT_ACCURACY_M = 35;

// checkpoint por deslocamento: só recalcula velocidade/rendimento a cada X metros
let segDistKm = 0;
let segStartTime = null;

function widthM(){ return parseFloat(document.getElementById('widthInput').value) || 0; }
function intervalKm(){ return (parseFloat(document.getElementById('intervalInput').value) || 50) / 1000; }

/* ======================= UTILS ======================= */
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371;
  const dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function fmt(n,d=2){ return n.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtTime(ms){
  const s=Math.floor(ms/1000);
  const h=String(Math.floor(s/3600)).padStart(2,'0');
  const m=String(Math.floor((s%3600)/60)).padStart(2,'0');
  const sec=String(s%60).padStart(2,'0');
  return `${h}:${m}:${sec}`;
}

/* ======================= MAP ======================= */
function initMap(){
  map = L.map('map',{zoomControl:false,attributionControl:false}).setView([-4.3,-44.4],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  polyline = L.polyline([],{color:'#E8A33D',weight:4}).addTo(map);
}

/* ======================= TRACKING ======================= */
function startTracking(){
  if(!navigator.geolocation){ alert('GPS não disponível neste dispositivo.'); return; }
  tracking = true;
  path = []; totalDistanceKm = 0; elapsedWorkMs = 0; lastPos = null; startTime = Date.now(); lastTickTime = Date.now();
  segDistKm = 0; segStartTime = Date.now();
  document.getElementById('speedNote').textContent = `(a cada ${document.getElementById('intervalInput').value} m)`;
  polyline.setLatLngs([]);
  document.getElementById('startBtn').style.display='none';
  document.getElementById('stopBtn').style.display='block';
  document.getElementById('footerBar').style.display='none';
  const pill = document.getElementById('statusPill');
  pill.classList.add('active');
  document.getElementById('statusText').textContent='Em operação';

  watchId = navigator.geolocation.watchPosition(onPosition, onGeoError, {
    enableHighAccuracy:true, maximumAge:1000, timeout:15000
  });
  timerInterval = setInterval(tickTimer, 1000);
}

function onGeoError(err){
  console.warn('GPS erro', err);
}

function onPosition(pos){
  const {latitude,longitude,accuracy} = pos.coords;
  const now = Date.now();
  if(accuracy && accuracy > MAX_ACCEPT_ACCURACY_M){ return; } // descarta leitura ruim

  // sempre desenha o trajeto no mapa em tempo real, mesmo entre checkpoints
  polyline.addLatLng([latitude,longitude]);
  if(!marker){ marker = L.circleMarker([latitude,longitude],{radius:7,color:'#E8A33D',fillColor:'#E8A33D',fillOpacity:1}).addTo(map); }
  else{ marker.setLatLng([latitude,longitude]); }
  map.panTo([latitude,longitude]);
  path.push({lat:latitude,lng:longitude,t:now});

  if(lastPos){
    const dKm = haversineKm(lastPos.lat,lastPos.lng,latitude,longitude);
    segDistKm += dKm;
  }
  lastPos = {lat:latitude,lng:longitude,t:now};

  // só recalcula velocidade/rendimento quando o deslocamento atinge o intervalo configurado (padrão 50 m)
  const threshold = intervalKm();
  if(segDistKm >= threshold && segStartTime !== null){
    const dtH = (now - segStartTime) / 3600000;
    const speedKmh = dtH > 0 ? segDistKm/dtH : 0;
    currentSpeedKmh = speedKmh;
    totalDistanceKm += segDistKm;
    if(speedKmh >= MIN_MOVE_SPEED_KMH){ elapsedWorkMs += (now - segStartTime); }
    segDistKm = 0;
    segStartTime = now;
    renderReadouts();
  }
}

function tickTimer(){
  document.getElementById('timeVal').textContent = fmtTime(Date.now()-startTime);
}

function renderReadouts(){
  const w = widthM();
  const areaHa = (totalDistanceKm * w) / 10;
  const instRateHaH = (currentSpeedKmh * w) / 10;
  const workHours = elapsedWorkMs/3600000;
  const avgRateHaH = workHours>0 ? areaHa/workHours : 0;

  document.getElementById('speedVal').innerHTML = fmt(currentSpeedKmh,1)+'<span class="readout-unit">km/h</span>';
  document.getElementById('instRate').innerHTML = fmt(instRateHaH,2)+'<span class="readout-unit">ha/h</span>';
  document.getElementById('avgRate').innerHTML = fmt(avgRateHaH,2)+'<span class="readout-unit">ha/h</span>';
  document.getElementById('areaVal').textContent = fmt(areaHa,2)+' ha';
  document.getElementById('distVal').textContent = fmt(totalDistanceKm,2)+' km';
}

function stopTracking(){
  tracking = false;
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  clearInterval(timerInterval);

  // fecha o trecho parcial (menor que o intervalo) que ainda não tinha sido computado
  if(segDistKm > 0 && segStartTime !== null){
    const now = Date.now();
    const dtH = (now - segStartTime) / 3600000;
    const speedKmh = dtH > 0 ? segDistKm/dtH : 0;
    totalDistanceKm += segDistKm;
    if(speedKmh >= MIN_MOVE_SPEED_KMH){ elapsedWorkMs += (now - segStartTime); }
    segDistKm = 0;
  }
  document.getElementById('startBtn').style.display='block';
  document.getElementById('stopBtn').style.display='none';
  document.getElementById('statusPill').classList.remove('active');
  document.getElementById('statusText').textContent='Parado';

  const session = buildSessionSummary();
  if(session.areaHa > 0 || session.distKm > 0){
    saveSession(session);
    document.getElementById('footerBar').style.display='flex';
    window.__lastSession = session;
  }
}

function buildSessionSummary(){
  const w = widthM();
  const areaHa = (totalDistanceKm * w) / 10;
  const workHours = elapsedWorkMs/3600000;
  const totalHours = (Date.now()-startTime)/3600000;
  const avgRateHaH = workHours>0 ? areaHa/workHours : 0;
  const avgSpeed = workHours>0 ? totalDistanceKm/workHours : 0;
  return {
    dataISO: new Date().toISOString(),
    operador: document.getElementById('operatorInput').value || '—',
    talhao: document.getElementById('fieldInput').value || '—',
    fazenda: document.getElementById('farmInput').value || '—',
    larguraM: w,
    distKm: totalDistanceKm,
    areaHa: areaHa,
    tempoTotalMin: totalHours*60,
    tempoTrabalhoMin: workHours*60,
    rendimentoMedioHaH: avgRateHaH,
    velocidadeMediaKmH: avgSpeed,
    trajeto: path.filter((_,i)=> i % 3 === 0).map(p=>({lat:p.lat,lng:p.lng})) // decimado p/ economizar espaço
  };
}

/* ======================= PERSISTENCE ======================= */
function localKey(){ return 'telemetria_sessoes_local'; }
function saveLocal(session){
  const list = JSON.parse(localStorage.getItem(localKey())||'[]');
  list.unshift(session);
  localStorage.setItem(localKey(), JSON.stringify(list.slice(0,100)));
}
async function saveSession(session){
  saveLocal(session);
  if(firebaseOK){
    try{
      await db.collection(COLLECTION).add(session);
    }catch(e){ console.warn('Falha ao sincronizar com Firebase', e); }
  }
  renderHistory();
}

async function renderHistory(){
  const list = document.getElementById('histList');
  let sessions = JSON.parse(localStorage.getItem(localKey())||'[]');
  if(firebaseOK){
    try{
      const snap = await db.collection(COLLECTION).orderBy('dataISO','desc').limit(50).get();
      sessions = snap.docs.map(d=>d.data());
    }catch(e){ /* mantém a lista local em caso de falha */ }
  }
  if(sessions.length===0){
    list.innerHTML = '<div class="empty-state">Nenhuma sessão registrada ainda.</div>';
    return;
  }
  list.innerHTML = sessions.map(s=>{
    const d = new Date(s.dataISO);
    return `<div class="session-card">
      <div class="date">${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} — ${s.talhao||''} ${s.fazenda?('· '+s.fazenda):''}</div>
      <div class="session-metrics">
        <div>Área<b>${fmt(s.areaHa,2)} ha</b></div>
        <div>Rendimento<b>${fmt(s.rendimentoMedioHaH,2)} ha/h</b></div>
        <div>Distância<b>${fmt(s.distKm,2)} km</b></div>
      </div>
    </div>`;
  }).join('');
}

/* ======================= EXPORT ======================= */
document.getElementById('pdfBtn').addEventListener('click',()=>{
  const s = window.__lastSession; if(!s) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const d = new Date(s.dataISO);
  doc.setFontSize(16); doc.text('Relatório de Telemetria', 14, 18);
  doc.setFontSize(10);
  const lines = [
    `Data: ${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR')}`,
    `Operador: ${s.operador}`,
    `Fazenda: ${s.fazenda}   Talhão: ${s.talhao}`,
    `Largura de trabalho: ${fmt(s.larguraM,1)} m`,
    `Distância percorrida: ${fmt(s.distKm,2)} km`,
    `Área trabalhada: ${fmt(s.areaHa,2)} ha`,
    `Tempo total: ${fmt(s.tempoTotalMin,0)} min   Tempo efetivo: ${fmt(s.tempoTrabalhoMin,0)} min`,
    `Velocidade média: ${fmt(s.velocidadeMediaKmH,1)} km/h`,
    `Rendimento médio: ${fmt(s.rendimentoMedioHaH,2)} ha/h`
  ];
  lines.forEach((l,i)=> doc.text(l, 14, 32+i*8));
  doc.save(`telemetria_${d.toISOString().slice(0,10)}.pdf`);
});

document.getElementById('waBtn').addEventListener('click',()=>{
  const s = window.__lastSession; if(!s) return;
  const txt = `🚜 Relatório de Telemetria\n`+
    `Talhão: ${s.talhao} — ${s.fazenda}\n`+
    `Área: ${fmt(s.areaHa,2)} ha\n`+
    `Rendimento médio: ${fmt(s.rendimentoMedioHaH,2)} ha/h\n`+
    `Distância: ${fmt(s.distKm,2)} km\n`+
    `Velocidade média: ${fmt(s.velocidadeMediaKmH,1)} km/h`;
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
});

/* ======================= UI WIRING ======================= */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
    btn.classList.add('on');
    document.getElementById(btn.dataset.view).classList.add('on');
    if(btn.dataset.view==='histView') renderHistory();
  });
});
document.getElementById('startBtn').addEventListener('click',startTracking);
document.getElementById('stopBtn').addEventListener('click',stopTracking);

// persist config fields
['widthInput','operatorInput','fieldInput','farmInput'].forEach(id=>{
  const el = document.getElementById(id);
  const saved = localStorage.getItem('cfg_'+id);
  if(saved!==null) el.value = saved;
  el.addEventListener('change',()=> localStorage.setItem('cfg_'+id, el.value));
});

document.getElementById('syncNote').textContent = firebaseOK
  ? 'Conectado ao Firebase — sessões sincronizam entre dispositivos.'
  : 'Sem configuração do Firebase — sessões ficam salvas só neste aparelho. Edite firebaseConfig no código para sincronizar.';
document.getElementById('syncNote').classList.toggle('err', !firebaseOK);

initMap();
renderHistory();

// registra um service worker mínimo para funcionar offline (opcional / best-effort)
if('serviceWorker' in navigator){
  const swCode = `self.addEventListener('fetch', e=>{});`;
  const blob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
</script>
</body>
</html>
